<div class="forgot-container">

  <mat-card>
    <p>
      Enter your registered email address.
    </p>
    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Email</mat-label>

      <input
        matInput
        type="email"
        placeholder="Enter your email">

    </mat-form-field>

    <button
      mat-raised-button
      color="primary">

      Send OTP

    </button>

  </mat-card>

</div>
