<div class="otp-container">

  <mat-card>

    <h2>OTP Verification</h2>

    <p>
      Enter the 6-digit OTP sent to your email.
    </p>

    <mat-form-field appearance="outline" class="full-width">

      <mat-label>OTP</mat-label>

      <input
        matInput
        maxlength="6"
        placeholder="Enter OTP">

    </mat-form-field>

    <button
      mat-raised-button
      color="primary">

      Verify OTP

    </button>

  </mat-card>

</div>
